<!DOCTYPE html>
<!--
  App Store screenshot #1 (JP) — code-composed layout.
  Tokens replaced by build_screenshot1.py: {{FONT_900}} {{FONT_700}} {{ICON}} {{SCREEN}} {{STARS}} {{LAUREL}}
  Canvas is fixed at 1320x2868 (6.9" iPhone, 2026 lead size). 1px-exact, no scroll.
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'NotoJP';
    font-weight: 900;
    font-style: normal;
    src: url(data:font/woff2;base64,{{FONT_900}}) format('woff2');
  }
  @font-face {
    font-family: 'NotoJP';
    font-weight: 700;
    font-style: normal;
    src: url(data:font/woff2;base64,{{FONT_700}}) format('woff2');
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1320px;
    height: 2868px;
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 1320px;
    height: 2868px;
    /* cosmic background — matches app gradients.background */
    background: linear-gradient(180deg, #0A0A0F 0%, #1a1a3e 55%, #2d1b4e 100%);
    overflow: hidden;
    font-family: 'NotoJP', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* --- background decoration --- */
  .stars { position: absolute; inset: 0; z-index: 1; }
  .star { position: absolute; background: #ffffff; border-radius: 50%; }
  .star.bright { box-shadow: 0 0 6px 1px rgba(255,255,255,0.85); }

  .glow-bottom {
    position: absolute; left: 50%; bottom: -240px; transform: translateX(-50%);
    width: 1500px; height: 1000px; z-index: 1;
    background: radial-gradient(ellipse at center, rgba(124,77,255,0.40) 0%, rgba(45,27,78,0) 62%);
    filter: blur(30px);
  }
  .glow-cyan {
    position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
    width: 900px; height: 520px; z-index: 1;
    background: radial-gradient(ellipse at center, rgba(56,189,248,0.22) 0%, rgba(56,189,248,0) 66%);
    filter: blur(36px);
  }
  .glow-phone {
    position: absolute; left: 50%; top: 1180px; transform: translateX(-50%);
    width: 1180px; height: 1180px; z-index: 1;
    background: radial-gradient(circle at center, rgba(124,77,255,0.30) 0%, rgba(124,77,255,0) 60%);
    filter: blur(28px);
  }

  /* --- foreground content --- */
  .content {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 116px;
  }

  .icon {
    width: 156px; height: 156px; border-radius: 35px;
    box-shadow:
      0 0 50px rgba(124,77,255,0.55),
      0 0 0 1px rgba(255,255,255,0.10),
      0 18px 40px rgba(0,0,0,0.45);
  }

  .headline {
    margin-top: 52px;
    text-align: center;
    color: #ffffff;
    font-weight: 900;
    font-size: 108px;
    line-height: 1.20;
    letter-spacing: 0.01em;
    text-shadow: 0 3px 26px rgba(124,77,255,0.45), 0 2px 8px rgba(0,0,0,0.45);
  }

  /* --- phone hero --- */
  .phone-wrap {
    margin-top: 66px;
    perspective: 2600px;
    perspective-origin: 50% 42%;
  }
  .phone {
    width: 860px; height: 1818px;
    background: #05050a;
    border-radius: 86px;
    padding: 18px;
    transform: rotateY(-16deg) rotateX(3deg);
    transform-style: preserve-3d;
    box-shadow:
      0 70px 130px rgba(0,0,0,0.62),
      0 0 0 2px rgba(255,255,255,0.05),
      inset 0 0 0 1.5px rgba(255,255,255,0.08),
      inset 8px 0 18px rgba(255,255,255,0.06);  /* left-edge highlight for 3D */
  }
  .screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 68px;
    overflow: hidden;
    background: #000;
  }
  .screen img { display: block; width: 100%; height: 100%; object-fit: fill; }
  .screen::after {
    /* faint glass sheen — kept very subtle so the real UI stays readable */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 26%);
    pointer-events: none;
  }

  /* --- laurel badges --- */
  .badges {
    margin-top: auto; margin-bottom: 104px;
    display: flex; gap: 84px; align-items: center; justify-content: center;
  }
  .badge { position: relative; width: 380px; height: 196px; }
  .badge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .badge-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    color: #ffffff;
    font-weight: 700;
    font-size: 40px;
    line-height: 1.32;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow-phone"></div>
    <div class="glow-bottom"></div>
    <div class="glow-cyan"></div>
    <div class="stars">{{STARS}}</div>

    <div class="content">
      <img class="icon" src="data:image/png;base64,{{ICON}}" alt="Rewire" />

      <div class="headline">欲に振り回されない<br/>毎日へ</div>

      <div class="phone-wrap">
        <div class="phone">
          <div class="screen">
            <img src="data:image/jpeg;base64,{{SCREEN}}" alt="Rewire dashboard" />
          </div>
        </div>
      </div>

      <div class="badges">
        <div class="badge">
          {{LAUREL}}
          <div class="badge-text">記録は端末の<br/>中だけ</div>
        </div>
        <div class="badge">
          {{LAUREL}}
          <div class="badge-text">脳科学に<br/>もとづく設計</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
